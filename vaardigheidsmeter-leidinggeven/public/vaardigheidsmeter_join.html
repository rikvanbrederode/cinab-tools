<style>
:root{
 --cinab-amber:#EF9F27;--cinab-amber-dark:#D88C14;--cinab-ink:#1C1C1A;--cinab-offwhite:#FAFAF8;
 --cinab-line:#E5E3DB;--cinab-grey:#5F5E5A;--cinab-card:#FFFFFF;
 --tool-blue:#70A2D7;--tool-green:#BDD24D;--tool-teal:#2A9791;--tool-coral:#F05736;
 --font-heading:Fraunces,Georgia,"Times New Roman",serif;
 --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --radius:12px;--radius-s:8px;--radius-pill:999px;--touch:44px;
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--cinab-offwhite);color:var(--cinab-ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-0.01em;margin:0}
:focus-visible{outline:3px solid var(--cinab-amber-dark);outline-offset:2px;border-radius:4px}
.wrap{width:min(720px,calc(100% - 36px));margin:0 auto}
.app-header{background:var(--cinab-card);border-bottom:1px solid var(--cinab-line)}
.app-header .wrap{display:flex;align-items:center;gap:12px;padding:14px 0}
.app-header svg{height:38px;width:38px;flex:none}
.app-header b{font-family:var(--font-heading);font-weight:600;font-size:18px}
.lang-btn{margin-left:auto;font-size:12px;font-weight:700;color:var(--cinab-ink);background:var(--cinab-card);border:1px solid var(--cinab-line);border-radius:var(--radius-pill);padding:4px 12px;cursor:pointer;min-height:32px}
.lang-btn:hover{background:var(--cinab-offwhite)}
.app-header span{color:var(--cinab-grey);font-size:13px}
main{padding:22px 0 60px}
.card{background:var(--cinab-card);border:1px solid var(--cinab-line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.h-accent{height:4px;width:56px;background:var(--tool-teal);border-radius:2px;margin:2px 0 12px}
.page-title{font-size:26px;margin-bottom:4px}
.lead{color:var(--cinab-grey)}
.field{display:grid;gap:6px;margin:12px 0}
.label{font-size:13px;font-weight:700}
.input{width:100%;min-height:var(--touch);border:1px solid var(--cinab-line);border-radius:var(--radius-s);background:var(--cinab-card);color:var(--cinab-ink);padding:10px 12px;font:inherit}
.help{color:var(--cinab-grey);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
.btn{min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--radius-s);padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn--primary{background:var(--cinab-amber);color:var(--cinab-ink)}
.btn--primary:hover{background:var(--cinab-amber-dark)}
.btn--primary:disabled{opacity:.5;cursor:not-allowed}
.btn--ghost{background:transparent;color:var(--cinab-grey);border:1px solid var(--cinab-line)}
.banner{border-radius:var(--radius-s);padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.banner--demo{background:var(--cinab-card);border:1px solid var(--cinab-amber);border-left:4px solid var(--cinab-amber);color:var(--cinab-ink)}
.banner--err{background:var(--cinab-card);border:1px solid var(--tool-coral);border-left:4px solid var(--tool-coral);color:var(--cinab-ink)}
.progress{position:sticky;top:0;z-index:5;background:var(--cinab-offwhite);padding:10px 0;border-bottom:1px solid var(--cinab-line);margin-bottom:8px}
.progress .wrap{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;background:var(--cinab-line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--tool-teal);transition:width .2s}
.pnum{font-size:13px;font-weight:700;color:var(--cinab-grey);font-variant-numeric:tabular-nums}
.domain-head{display:flex;align-items:center;gap:9px;margin:18px 0 4px}
.domain-dot{width:13px;height:13px;border-radius:50%}
.domain-name{font-family:var(--font-heading);font-weight:600;font-size:18px}
.dotted{border:0;border-top:2px dotted var(--cinab-line);margin:4px 0 10px}
.comp{border:1px solid var(--cinab-line);border-left:6px solid var(--comp,var(--tool-teal));border-radius:var(--radius-s);padding:14px 16px;margin:10px 0;background:var(--cinab-card)}
.comp.na{opacity:.5}
.comp__title{font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.coin{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.stmt{margin:8px 0}
.stmt__txt{margin:0 0 6px;font-size:14.5px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale input{position:absolute;opacity:0;width:0;height:0}
.scale label{min-width:42px;min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--cinab-line);border-radius:var(--radius-s);cursor:pointer;font-weight:600}
.scale input:checked+label{background:var(--cinab-ink);color:var(--cinab-offwhite);border-color:var(--cinab-ink)}
.scale input:focus-visible+label{outline:3px solid var(--cinab-amber-dark);outline-offset:2px}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--cinab-grey);margin-top:4px}
.na-row{display:flex;gap:8px;align-items:center;min-height:var(--touch);margin-top:6px;font-size:13px;color:var(--cinab-grey);cursor:pointer}
.na-row input{width:18px;height:18px}
.sticky-actions{position:sticky;bottom:0;background:var(--cinab-offwhite);border-top:1px solid var(--cinab-line);padding:14px 0;display:flex;gap:10px;justify-content:flex-end}
.done-ico{width:54px;height:54px;border-radius:50%;background:var(--tool-green);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
[hidden]{display:none!important}
</style>
</head>

  <section id="screen-intro" class="card">

    <p style="font-size:14px;margin-top:12px" data-i18n-html="introBody"></p>

      <input class="input" id="f-name" type="text" maxlength="120" autocomplete="name" data-i18n-ph="phName" placeholder="Voor- en achternaam">
    </div>
    <div class="field">
      <label class="label" for="f-email" data-i18n-html="lblEmail"></label>
      <input class="input" id="f-email" type="email" maxlength="200" autocomplete="email" data-i18n-ph="phEmail" placeholder="naam@organisatie.nl">

    <label class="check"><input type="checkbox" id="f-consent">
      <span data-i18n-html="consent"></span>

function buildModel(lang){
 var L=MODEL[lang]||MODEL.nl;
 return MODEL.struct.map(function(d){
  return {id:d.id,color:d.color,name:L.dom[d.id],
   comps:d.comps.map(function(n){return {n:n,label:L.comp[n].label,a:L.comp[n].a,b:L.comp[n].b};})};
 });
}
/* ═══ /VLM SHARED: MODEL ═══ */
/* Taal: 'nl' of 'en'. DOMAINS/COMPS worden hieruit afgeleid en bij een taalwissel opnieuw gebouwd. */
var LANG="nl", DOMAINS=[], COMPS=[];
function rebuildModel(){ DOMAINS=buildModel(LANG); COMPS=[]; DOMAINS.forEach(function(d){d.comps.forEach(function(c){c._d=d;COMPS.push(c);});}); }
rebuildModel();

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function R(v){return Math.round(v);}
function show(id){["screen-intro","screen-quiz","screen-done"].forEach(function(s){$(s).hidden=(s!==id);});window.scrollTo(0,0);}
function compPct(n){var a=ans[n];if(!a||a.na||!a.a||!a.b)return null;return R(((a.a+a.b)-2)/8*100);}

var ans={}, code="", fb=null, db=null, demo=false, joinedKey="";

/* ═══ VLM SHARED: LIBREADY (gedeeld blok — byte-identiek in hoofd-app en join) ═══ */
function libReady(){
  return new Promise(function(resolve){
    var n=0;
    (function poll(){
      if(window.__VLM_LIB__){ Promise.resolve(window.__VLM_LIB__).then(resolve,function(){resolve(null);}); return; }
      if(n++>150){ resolve(null); return; }   // ~3s; daarna nette terugval op demo
      setTimeout(poll,20);
    })();
  });
}

var SUBJECT="", ORG="";
function T(k,vars){
 var s=(JUI[LANG]&&JUI[LANG][k]!=null)?JUI[LANG][k]:(JUI.nl[k]!=null?JUI.nl[k]:k);
 if(vars) Object.keys(vars).forEach(function(v){ s=s.split("{"+v+"}").join(vars[v]); });
 return s;
}
function subjectText(){ return SUBJECT || T("defaultSubject"); }
function applyI18n(){
 document.documentElement.lang=LANG;
 var sub=esc(subjectText());
 document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent=T(el.getAttribute("data-i18n")); });
 document.querySelectorAll("[data-i18n-html]").forEach(function(el){ el.innerHTML=T(el.getAttribute("data-i18n-html"),{subject:sub}); });
 document.querySelectorAll("[data-i18n-ph]").forEach(function(el){ el.setAttribute("placeholder",T(el.getAttribute("data-i18n-ph"))); });
 if(ORG){ var is=$("intro-sub"); if(is) is.innerHTML+=' <span class="help">'+esc(T("orgNote",{org:ORG}))+'</span>'; }
 var lb=$("lang-btn"); if(lb){ lb.textContent=T("langBtn"); lb.setAttribute("aria-label",T("langAria")); }
}
/* Taal wisselen: model + teksten opnieuw, vragenlijst hertekenen, ingevulde antwoorden behouden. */
function setLang(l){
 if(l!=="nl"&&l!=="en") l="nl";
 LANG=l; rebuildModel();
 try{ localStorage.setItem("vlm_lang",LANG); }catch(e){}
 applyI18n(); buildQuiz();
}

/* sessiecode UITSLUITEND uit de URL (pad /join/{code} of ?join=/?code=); nooit genereren */
function readCode(){
  var m=location.pathname.match(/\/join\/([^\/?#]+)/i);
  if(m && m[1] && m[1].toLowerCase()!=="vaardigheidsmeter_join.html") return decodeURIComponent(m[1]);
  var p=new URLSearchParams(location.search); return p.get("join")||p.get("code")||"";
}

var quizBuilt=false;
function buildQuiz(){
 var body=$("quiz-body");body.innerHTML="";
 DOMAINS.forEach(function(d){
  var blk=document.createElement("div");blk.className="card";blk.style.paddingTop="14px";
  blk.innerHTML='<div class="domain-head"><span class="domain-dot" style="background:'+d.color+'"></span><span class="domain-name">'+d.name+'</span></div><hr class="dotted">';
  d.comps.forEach(function(c){
   var el=document.createElement("div");el.className="comp";el.style.setProperty("--comp",d.color);el.id="comp-"+c.n;
   el.innerHTML='<p class="comp__title"><span class="coin" style="background:'+d.color+'"></span>'+c.n+' · '+esc(c.label)+'</p>'+
     stmt(c.n+"_a",c.a)+stmt(c.n+"_b",c.b)+
     '<label class="na-row"><input type="checkbox" id="na-'+c.n+'"> '+esc(T("na"))+'</label>';
   blk.appendChild(el);
  });
  body.appendChild(blk);
 });
 if(!quizBuilt){ body.addEventListener("change",onAnswer); quizBuilt=true; }
 restoreAnswers();
 progress();
}
/* antwoorden staan in ans; de DOM volgt (taalwissel, terugnavigatie) */
function restoreAnswers(){
 COMPS.forEach(function(c){var a=ans[c.n];if(!a)return;
  ["a","b"].forEach(function(k){var v=a[k];if(v>=1&&v<=5){var r=$(c.n+"_"+k+"_"+v);if(r)r.checked=true;}});
  var na=$("na-"+c.n);if(na){na.checked=(a.na===true);$("comp-"+c.n).classList.toggle("na",a.na===true);}
 });
}
function stmt(name,txt){
 var h='<div class="stmt"><p class="stmt__txt">'+esc(txt)+'</p><div class="scale" role="radiogroup" aria-label="'+esc(txt)+'">';
 for(var i=1;i<=5;i++)h+='<input type="radio" id="'+name+'_'+i+'" name="'+name+'" value="'+i+'"><label for="'+name+'_'+i+'">'+i+'</label>';
 h+='</div><div class="scale-legend"><span>'+esc(T("scaleLo"))+'</span><span>'+esc(T("scaleHi"))+'</span></div></div>';
 return h;
}
function onAnswer(e){var t=e.target;
 if(t.type==="checkbox"){var n=t.id.replace("na-","");ans[n]=ans[n]||{};ans[n].na=t.checked;$("comp-"+n).classList.toggle("na",t.checked);}
 else if(t.type==="radio"){var p=t.name.split("_");ans[p[0]]=ans[p[0]]||{};ans[p[0]][p[1]]=parseInt(t.value,10);}
 progress();
}
function resolved(c){var a=ans[c.n];return a&&(a.na===true||(a.a&&a.b));}
function progress(){var done=COMPS.filter(resolved).length;$("pbar").style.width=(done/20*100)+"%";$("pnum").textContent=T("progress",{done:done});$("btn-submit").disabled=(done<20);}

async function submit(){
 var name=$("f-name").value.trim();
 var vals={}; COMPS.forEach(function(c){var p=compPct(c.n); if(p!==null) vals[c.n]=p;});
 if(!Object.keys(vals).length){ err(T("errAllNa")); $("btn-submit").disabled=false; return; }
 var entry={ name:name, naamZichtbaar:$("f-consent").checked, vals:vals };
 var email=$("f-email").value.trim(); if(email) entry.email=email;
 if(demo){ finishDone(); return; }
 try{
   entry.at = fb.serverTimestamp();
   var listRef=fb.ref(db,'sessions/'+code+'/answers');
   await fb.push(listRef, entry);
   try{ localStorage.setItem(joinedKey,"1"); }catch(_){}
   finishDone();
 }catch(e){ err(T("errSend",{e:(e&&e.message||e)})); $("btn-submit").disabled=false; }
}
function finishDone(){ show("screen-done"); }
function err(msg){ var b=$("banner-err"); b.textContent=msg; b.hidden=false; window.scrollTo(0,0); }

/* ── start ── */
(async function(){
 code=readCode();
 joinedKey="vlm_joined_"+code;
 var p=new URLSearchParams(location.search);
 /* taal: URL (?lang=) > eerder gekozen taal > NL; de sessietaal kan dit hierna nog overschrijven */
 var q=(p.get("lang")||"").toLowerCase().trim(), st="";
 try{ st=localStorage.getItem("vlm_lang")||""; }catch(e){}
 LANG=(q==="en"||q==="nl")?q:((st==="en"||st==="nl")?st:"nl"); rebuildModel(); applyI18n();
 if(p.get("r")) $("f-email").value=p.get("r");      // optioneel: gepersonaliseerde link prefilt e-mail

 // al ingevuld op dit apparaat? -> direct bedankt
 try{ if(code && localStorage.getItem(joinedKey)){ buildQuiz(); show("screen-done"); wireButtons(); return; } }catch(_){}

 var lib=await libReady();
 var hasConfig = FB_CONFIG.apiKey.indexOf("INVULLEN")<0;

 if(!code || !lib || !hasConfig){
   demo=true; $("banner-demo").hidden=false;        // standalone/oefenmodus
 } else {
   try{
     fb=lib.fb;
     var app=fb.initializeApp(FB_CONFIG); var auth=fb.getAuth(app); db=fb.getDatabase(app);
     await fb.signInAnonymously(auth);
     // sessie-inhoud ophalen voor de koptekst (organisatie / subject)
     try{
       var snap=await fb.get(fb.ref(db,'sessions/'+code+'/content'));
       var c=snap && snap.val ? snap.val() : null;
       if(c){
         SUBJECT = c.subject || "";
         ORG = c.organisatie || "";
         /* sessietaal volgen, tenzij de beoordelaar zelf al een taal koos (?lang= of eerder gekozen) */
         if((c.lang==="nl"||c.lang==="en") && !q && !st) LANG=c.lang;
         rebuildModel(); applyI18n();
       }
     }catch(_){ /* content nog niet gepubliceerd — generieke tekst blijft staan */ }
   }catch(e){ demo=true; $("banner-demo").hidden=false; console.warn("[join] live-init mislukt -> demo:",e); }
 }
 buildQuiz();
 wireButtons();
})();

function wireButtons(){
 $("btn-begin").onclick=function(){
   var name=$("f-name").value.trim(), email=$("f-email").value.trim();
   if(!name){ err(T("errNoName")); $("f-name").focus(); return; }
   if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err(T("errEmail")); $("f-email").focus(); return; }
   $("banner-err").hidden=true; show("screen-quiz");
 };
 $("btn-back").onclick=function(){ show("screen-intro"); };
 $("lang-btn").onclick=function(){ setLang(LANG==="nl"?"en":"nl"); };
 $("btn-submit").onclick=function(){ $("btn-submit").disabled=true; submit(); };
}
/* pageshow: herstel knoppen na terug-navigatie (bfcache) */
window.addEventListener("pageshow",function(){ var b=$("btn-submit"); if(b){ progress(); } });
</script>
